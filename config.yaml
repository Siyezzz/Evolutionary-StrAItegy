# Evolutionary-StrAItegy — runtime configuration
# Comments and blank lines are ignored by the minimal loader.
# One key:value pair per line.

# Market to study. Backtest data lives in data_csv.
symbol: BTC-USD
data_csv: data/market_btcusd_daily.csv

# Walk-forward layout (in trading days)
train_window: 504        # training length; also the first test boundary
test_horizon: 21         # out-of-sample window length per epoch (no future leakage)
min_train: 252           # minimum in-sample length before we start testing
window_mode: rolling     # rolling keeps the economic memory horizon explicit
periods_per_year: 365    # BTC trades every calendar day
inherit_champion: false  # inheritance failed the first paired robustness test

# Evolution Strategy (meta-parameter search on the in-sample window)
# Routine research budget. Larger searches require a predeclared experiment
# because every extra candidate increases both runtime and selection bias.
es_population: 4
es_generations: 2
es_sigma: 0.15

# Default meta-parameters (ES mutates around these)
risk: 1.0
vol_target: 0.02
blend_init: 0.5
allocator: legacy         # exponential remains a challenger until paired validation
allocator_reward_scale: 0.02
regret_mode: global      # contextual remains a challenger until transfer validation
context_shrinkage: 20.0
context_method: fixed
context_calibration_window: 252

# One-way proportional trading cost charged on absolute position turnover.
transaction_cost_bps: 10.0
max_abs_position: 1.0

# Experts that form the gene pool (one strategy module each)
experts: momentum,mean_reversion,news_sentiment

# Reproducibility
seed: 42
